# 말투 AI training server on your PC.
#   GPU (NVIDIA):  docker compose up -d --build
#   No GPU:        docker compose -f compose.yaml -f compose.cpu.yaml up -d --build
# Then open http://localhost:8001 on this PC and scan the QR code with the phone.
name: maltu-ai-trainer

services:
  trainer:
    build:
      context: ../..
      dockerfile: training/server/Dockerfile
    image: maltu-ai-trainer:local
    restart: unless-stopped
    ports:
      - "8000:8000"            # API + web app (token required); same-Wi-Fi phones use http://<PC IP>:8000
      - "127.0.0.1:8001:8001"  # pairing page with the token: this PC only
    volumes:
      - trainer-data:/data     # token, base-model cache, newest job's GGUF
    environment:
      # empty = the QR opens the app served by this PC through the tunnel; or https://jshaa.github.io/Talk_AI/
      APP_URL: ${APP_URL:-}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Replies of a persona imported from Colab (Qwen3-8B, too large to train on an 8 GB GPU): the official llama.cpp
  # CUDA server runs the 4-bit base + LoRA (about 5.5 GB of VRAM) while /data/llm/lora.gguf exists. Idle otherwise.
  llm:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda@sha256:31b39eacce2bab5fde9286ec3980ed5548a3987644e94da0d0c2092f93313538
    entrypoint: ["/bin/sh", "/llm.sh"]
    healthcheck:
      disable: true   # the image checks :8080, which is down while no adapter is imported
    restart: unless-stopped
    volumes:
      - trainer-data:/data:ro
      - ./llm.sh:/llm.sh:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Free HTTPS address (https://….trycloudflare.com) so the phone app can reach this PC from anywhere,
  # including the HTTPS web app. Traffic is TLS-encrypted but passes through Cloudflare.
  # To stay on the local network only: docker compose up -d trainer
  tunnel:
    image: cloudflare/cloudflared:2026.9.3
    command: tunnel --no-autoupdate --metrics 0.0.0.0:20241 --url http://trainer:8000
    restart: unless-stopped
    depends_on: [trainer]

volumes:
  trainer-data:
