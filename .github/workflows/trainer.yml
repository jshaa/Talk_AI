# 말투 AI PC training server (training/server): API tests, Docker image build, and a real CPU
# fine-tune smoke test (Qwen2.5-0.5B, 2 steps -> GGUF Q4_K_M) inside the image.
name: trainer

on:
  push:
    paths: ['training/**', 'apps/mimic/**', '.github/workflows/trainer.yml']
  pull_request:
    paths: ['training/**', 'apps/mimic/**', '.github/workflows/trainer.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trainer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install -r training/server/requirements.txt httpx
      - run: python training/server/test_server.py
      - run: python training/server/test_persona_train.py

  image:
    needs: api
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Free disk space (the image is large: torch + Unsloth)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: actions/checkout@v5
      - name: Build image
        run: docker build -f training/server/Dockerfile -t maltu-ai-trainer:ci .
      - name: Server starts and answers
        run: |
          docker run -d --name t -p 8000:8000 -e TRAINER_TOKEN=ci maltu-ai-trainer:ci
          for i in $(seq 30); do curl -sf localhost:8000/api/health && break; sleep 2; done
          curl -sf localhost:8000/ | grep -q '말투 AI'
          docker rm -f t
      - name: CPU fine-tune smoke test (Qwen2.5-0.5B, 2 steps, GGUF export)
        run: |
          mkdir -p /tmp/job/out && chmod -R 777 /tmp/job
          for i in $(seq 20); do cat training/fixtures/expected.jsonl; done > /tmp/job/data.jsonl
          docker run --rm -v /tmp/job:/job maltu-ai-trainer:ci python /app/persona_train.py \
            --data /job/data.jsonl --out /job/out --status /job/status.json --base qwen2.5-0.5b --cpu --max-steps 2
          cat /tmp/job/status.json
          grep -q '"stage": "done"' /tmp/job/status.json
          ls -la /tmp/job/out
          test -s /tmp/job/out/persona-q4_k_m.gguf
          test ! -e /tmp/job/data.jsonl
